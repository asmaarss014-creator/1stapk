<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dara Helper Tool - Admin Panel</title>
    <style>
        body { background: #000; color: #00FF66; font-family: monospace; padding: 20px; }
        h2 { color: #ffffff; border-bottom: 2px solid #00FF66; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background: #111; color: #fff; }
        tr:hover { background: #0a0a0a; }
        button { background: #1E88E5; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #1565C0; }
    </style>
</head>
<body>
    <h2>[DARA HELPER - ADMIN CONTROL CENTER]</h2>
    <table>
        <thead>
            <tr>
                <th>Device ID</th>
                <th>Model</th>
                <th>Pkg Version</th>
                <th>Pending Update</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for dev_id, info in devices.items() %}
            <tr>
                <td>{{ dev_id }}</td>
                <td>{{ info.device_model }}</td>
                <td>{{ info.installed_pkg_ver }}</td>
                <td>{{ info.pending_update or 'None' }}</td>
                <td>
                    <button onclick="suggestUpdate('{{ dev_id }}')">Suggest Update</button>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" style="text-align: center; color: #888;">No active device heartbeats received yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        async function suggestUpdate(deviceId) {
            const pkg = prompt("Enter package update name (e.g., payload-pkg-v1.0.3):");
            if (pkg) {
                const res = await fetch('/api/admin/suggest_update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ device_id: deviceId, pkg_name: pkg })
                });
                const data = await res.json();
                alert(data.message);
                location.reload();
            }
        }
    </script>
</body>
</html>
