name: Build Dara Helper Tool APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Find Dara Gradle Project
        run: |
          echo "===== REPOSITORY ====="
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "===== GRADLE FILES ====="
          find dara -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \
          \) -print

      - name: Build Dara APK
        run: |
          PROJECT_DIR=$(dirname "$(find dara -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: No Gradle settings file was found inside dara/"
            echo ""
            echo "Your dara folder does not currently contain a Gradle project."
            exit 101
          fi

          echo "Gradle project found at: $PROJECT_DIR"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            cd "$PROJECT_DIR"
            ./gradlew assembleDebug --stacktrace
          else
            cd "$PROJECT_DIR"
            gradle assembleDebug --stacktrace
          fi

      - name: Find Generated APK
        run: |
          echo "===== APK FILES ====="
          find dara -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DaraHelperTool-Debug-APK
          path: dara/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
