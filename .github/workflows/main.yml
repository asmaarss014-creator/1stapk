name: Build Dara Helper Tool APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Check Dara Project
        run: |
          echo "Repository:"
          ls -la

          echo ""
          echo "Dara folder:"
          ls -la dara

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x dara/gradlew || true

      - name: Build Debug APK
        working-directory: dara
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Show APK Files
        run: |
          find dara -type f -name "*.apk" -print

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaraHelperTool-Debug-APK
          path: dara/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
