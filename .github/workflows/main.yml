name: Test Dara Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Project
        run: |
          echo "=== Dara Android Project ==="
          find dara/android_app -maxdepth 3 -type f | sort

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Check Gradle
        working-directory: dara/android_app
        run: |
          echo "=== Gradle Files ==="
          ls -la
          echo ""
          echo "=== Settings ==="
          cat settings.gradle || true
          echo ""
          echo "=== Gradle Version ==="
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version
          fi

      - name: Compile App
        working-directory: dara/android_app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Check APK
        run: |
          echo "=== APK RESULTS ==="
          find dara/android_app -type f -name "*.apk" -print

          if find dara/android_app -type f -name "*.apk" | grep -q .; then
            echo "✅ APK BUILD SUCCESSFUL"
          else
            echo "❌ NO APK WAS GENERATED"
            exit 1
          fi

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Dara-Test-APK
          path: dara/android_app/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
