name: Test Dara Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Find Gradle Project
        run: |
          echo "===== ALL FILES INSIDE DARA ====="
          find dara -type f -print | sort

          echo ""
          echo "===== SEARCHING FOR GRADLE ROOT ====="

          find dara -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "settings.gradle.dcl" \
          \) -print

          echo ""
          echo "===== SEARCHING FOR GRADLE WRAPPER ====="

          find dara -type f \( \
            -name "gradlew" \
            -o -name "gradlew.bat" \
          \) -print

      - name: Build
        run: |
          SETTINGS=$(find dara -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "settings.gradle.dcl" \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "❌ ERROR 101: No Gradle settings file exists inside dara/"
            echo ""
            echo "Expected one of:"
            echo "settings.gradle"
            echo "settings.gradle.kts"
            echo "settings.gradle.dcl"
            exit 101
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "✅ Gradle project found:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          echo "===== APK ====="
          find dara -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dara-Test-APK
          path: dara/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
