name: Build Dara Helper Tool APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant Gradle Permission
        run: |
          chmod +x dara/android_app/gradlew

      - name: Build Debug APK
        working-directory: dara/android_app
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===== GENERATED APK ====="
          find dara/android_app -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DaraHelperTool-Debug-APK
          path: dara/android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
